<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Gazer</title><style>
@font-face{font-family:Modak;src:url(fonts/Modak.ttf)}@font-face{font-family:DynaPuff;src:url(fonts/DynaPuff.ttf)}@font-face{font-family:RubikBubbles;src:url(fonts/RubikBubbles.ttf)}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000}header{background:white;border-bottom:3px solid black;padding:16px 20px 18px}header .brand{font:clamp(55px,12vw,94px)/.95 Modak,serif;letter-spacing:-1px}header .sub{font:12px Arial,sans-serif;margin-top:7px}nav{display:flex;gap:9px;overflow:auto;margin-top:18px;scrollbar-width:none}nav button{flex:none;border:1px solid black;border-radius:30px;padding:8px 14px;background:white;color:black;font:15px DynaPuff,Arial;cursor:pointer}nav button.active{background:black;color:white}main{max-width:780px;margin:auto;padding:25px 20px}.section{font:clamp(27px,6vw,43px) RubikBubbles,Arial;padding-bottom:20px;border-bottom:2px solid black}.story{padding:22px 0 26px;border-bottom:1px solid #bbb}.story .meta{font:11px Arial;letter-spacing:1.2px;text-transform:uppercase}.story h2{font:clamp(25px,5.6vw,38px)/1.18 DynaPuff,Arial;margin:12px 0}.story.featured h2{font:clamp(32px,7vw,51px)/1.18 RubikBubbles,Arial}.story a{color:inherit;text-decoration:none}.story a:hover{text-decoration:underline}.story p{font:15px/1.5 Arial,sans-serif;margin:0;color:#333}.empty{font:16px/1.5 Arial;margin-top:25px}.foot{font:12px/1.5 Arial;color:#444;padding:25px 0}button:focus-visible,a:focus-visible{outline:3px solid black;outline-offset:3px}
</style></head><body><header><div class="brand">GAZER</div><div class="sub" id="updated">A view of the news</div><nav id="nav" aria-label="Sections"></nav></header><main><div class="section" id="section">Top Stories</div><div id="stories"><p class="empty">Loading headlines…</p></div><div class="foot">Headlines from publicly available New York Times RSS feeds. Independent reader; not affiliated with The New York Times. Archived versions may not exist for every article.</div></main><script>
const sections=['Top Stories','World','U.S.','Politics','New York','Business','Technology','Science','Health','Arts','Books','Movies','Opinion'];
let data={sections:{}};let selected='Top Stories';
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.querySelector('#section').textContent=selected;document.querySelector('#nav').innerHTML=sections.map(s=>'<button data-section="'+safe(s)+'" class="'+(s===selected?'active':'')+'">'+safe(s)+'</button>').join('');let items=data.sections[selected]||[];document.querySelector('#stories').innerHTML=items.length?items.map((a,i)=>{let url='https://archive.is/'+encodeURIComponent(a.url);return '<article class="story '+(i===0?'featured':'')+'"><div class="meta">'+safe(selected)+(a.date?' · '+safe(new Date(a.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})):'')+'</div><h2><a href="'+safe(url)+'" target="_blank" rel="noopener noreferrer">'+safe(a.title)+'</a></h2>'+(a.summary?'<p>'+safe(a.summary)+'</p>':'')+'</article>'}).join(''):'<p class="empty">No headlines available for this section yet.</p>';document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{selected=b.dataset.section;render()})}
fetch('headlines.json?x='+Math.floor(Date.now()/900000)).then(r=>{if(!r.ok)throw Error('Feed unavailable');return r.json()}).then(d=>{data=d;document.querySelector('#updated').textContent='A view of the news · Updated '+new Date(d.updated).toLocaleString();render()}).catch(()=>{document.querySelector('#stories').innerHTML='<p class="empty">Headlines are not available yet. The scheduled update will populate this page shortly.</p>';render()});
</script></body></html>
