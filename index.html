async function restoreOffline(){try{offlineDB=await openOfflineDB();const items=await new Promise((resolve,reject)=>{const req=offlineDB.transaction('articles').objectStore('articles').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});savedArticles=Object.fromEntries(items.filter(a=>a.text&&a.text.length>1000).map(a=>[a.url,a]));render()}catch(e){console.warn('Offline library unavailable',e)}}
async function toggleSaved(url){if(downloading.has(url))return;if(savedArticles[url]){await deleteOffline(url);delete savedArticles[url];render();return}const article=allArticles().find(a=>a.url===url);if(!article)return;downloading.add(url);render();try{if(!navigator.onLine)throw Error('Connect to download this article');if(!articleCatalog){const response=await fetch('articles.json',{cache:'no-store'});if(!response.ok)throw Error('Offline catalog unavailable');articleCatalog=await response.json()}const entry=articleCatalog[url];if(!entry||!entry.text||entry.text.length<1000)throw Error('Full text is not available for offline saving yet');const copy={...article,text:entry.text,savedAt:Date.now()};await storeOffline(copy);savedArticles[url]=copy}catch(e){alert(e.message)}finally{downloading.delete(url);render()}}
function readOffline(url){const a=savedArticles[url];if(!a||!a.text)return;const reader=document.getElementById('offline-reader');reader.querySelector('.reader-source').textContent=a.source||'';reader.querySelector('.reader-title').textContent=a.title||'';reader.querySelector('.reader-text').replaceChildren(...a.text.split(/\\n\\n|\\n/).filter(Boolean).map(p=>{const el=document.createElement('p');el.textContent=p;return el}));reader.hidden=false;document.body.style.overflow='hidden';reader.scrollTop=0}
function closeOffline(){document.getElementById('offline-reader').hidden=true;document.body.style.overflow=''}
function render(){
document.querySelector('#section').textContent=selectedTopic?selectedTopic:selected;
const sourceLabel=publications.find(([label,value])=>value===selectedSource)?.[0]||'All sources';document.querySelector('#tray-summary').textContent=[selected,selectedTopic||'All topics',sourceLabel].join(' • ');
document.querySelector('#nav').innerHTML='<div class="filter-row"><div class="filter-scroll">'+sections.map(label=>'<button data-section="'+safe(label)+'" class="'+(selected===label?'active':'')+'">'+safe(label)+'</button>').join('')+'</div></div>'+
'<div class="filter-row"><div class="filter-scroll"><button data-topic="" class="'+(!selectedTopic?'active':'')+'">All topics</button>'+topics.map(label=>'<button data-topic="'+safe(label)+'" class="'+(selectedTopic===label?'active':'')+'">'+safe(label)+'</button>').join('')+'</div></div>'+
'<div class="filter-row"><div class="filter-scroll">'+publications.map(([label,value])=>'<button data-source="'+safe(value)+'" class="'+(selectedSource===value?'active':'')+'">'+safe(label)+'</button>').join('')+'</div></div>';
const all=allArticles();let items;
if(selected==='Saved')items=Object.values(savedArticles).sort((a,b)=>b.savedAt-a.savedAt);
else if(selected==='Top Stories'){
  const leads=all.filter(a=>a.source==='NYT'&&a._sections?.includes('Top Stories'));
  const other=all.filter(a=>a.source!=='NYT').sort((a,b)=>Date.parse(b.date||0)-Date.parse(a.date||0));
  const firstBySource={};const picks=other.filter(a=>{const key=a.source||'Other';firstBySource[key]=(firstBySource[key]||0)+1;return firstBySource[key]<=5});
  items=interleave([...leads,...picks]);
}else items=interleave(all);
if(selectedSource)items=items.filter(a=>(a.source||'NYT')===selectedSource);
if(selectedTopic)items=items.filter(a=>matchesTopic(a,selectedTopic));
document.querySelector('#stories').innerHTML=items.length?items.map((a,i)=>{let url=a.url;let source=a.source||'NYT';let mark=marks[source]||'•';let archive='https://archive.is/'+a.url;return '<article class="story '+(i===0?'featured':'')+'"><div class="story-body"><div class="story-copy"><div class="meta"><span class="source-mark" data-source="'+safe(source)+'" title="'+safe(source)+'">'+safe(mark)+'</span><span class="story-date">'+(a.date?safe(new Date(a.date).toLocaleDateString('en-US',{month:'numeric',day:'numeric'})):'')+'</span><button class="save-bookmark '+(savedArticles[url]?'is-saved':downloading.has(url)?'is-downloading':'')+'" data-save="'+safe(url)+'" aria-label="'+(savedArticles[url]?'Remove offline download':downloading.has(url)?'Downloading':'Download for offline reading')+'" title="'+(savedArticles[url]?'Remove from Saved':'Save article')+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.5-6 4.5z"/></svg></button></div><h2><a href="'+safe(url)+'" target="_blank" rel="noopener noreferrer">'+headlineMarkup(a.title)+'</a></h2>'+(a.summary?'<p>'+safe(a.summary)+'</p>':'')+(source==='NYT'?'<a class="archive-link" aria-label="Look for archived copy on archive.is" title="Look for archived copy on archive.is" href="'+safe(archive)+'" target="_blank" rel="noopener noreferrer"><img src="assets/archive-eyes.svg" alt="" loading="lazy"></a>':'')+'</div>'+(a.image?'<a class="story-image" href="'+safe(url)+'" target="_blank" rel="noopener noreferrer" aria-label="Read '+safe(a.title)+'"><img class="stamp" src="'+safe(a.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer"></a>':'')+'</div></article>'}).join(''):'<p class="empty">No headlines available for this section yet.</p>';document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{selected=b.dataset.section;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{selectedTopic=b.dataset.topic;render()});document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{selectedSource=b.dataset.source;render()});document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>toggleSaved(b.dataset.save));document.querySelectorAll('[data-read]').forEach(b=>b.onclick=e=>{e.preventDefault();readOffline(b.dataset.read)})}
let refreshing=false;const pull=document.getElementById('pull-indicator');let pullStart=null,pullDistance=0;
async function loadHeadlines(force=false){if(refreshing)return;refreshing=true;if(force){pull.textContent='↻ Refreshing…';pull.classList.add('visible','loading')}try{const response=await fetch('headlines.json?x='+(force?Date.now():Math.floor(Date.now()/900000)),{cache:force?'reload':'default'});if(!response.ok)throw Error('Feed unavailable');data=await response.json();try{localStorage.setItem('thirty-headlines',JSON.stringify(data))}catch(e){}render();if(force)pull.textContent='✓ Updated'}catch(e){let saved=null;try{saved=JSON.parse(localStorage.getItem('thirty-headlines'))}catch(err){}if(saved){data=saved;render();if(force)pull.textContent='Offline · showing saved headlines'}else{document.querySelector('#stories').innerHTML='<p class="empty">Headlines unavailable offline until your first successful load.</p>';if(force)pull.textContent='Could not refresh'}}finally{refreshing=false;if(force)setTimeout(()=>{pull.classList.remove('visible','loading');pull.style.transform=''},1100)}}
window.addEventListener('touchstart',e=>{if(window.scrollY<=2&&e.touches.length===1){pullStart=e.touches[0].clientY;pullDistance=0}},{passive:true});
window.addEventListener('touchmove',e=>{if(pullStart===null)return;if(window.scrollY>2){pullStart=null;pull.classList.remove('visible');return}pullDistance=Math.max(0,e.touches[0].clientY-pullStart);if(pullDistance>24&&!refreshing){pull.classList.add('visible');pull.textContent=pullDistance>=85?'↑ Release to refresh':'↓ Pull to refresh'}},{passive:true});
window.addEventListener('touchend',()=>{if(pullStart!==null&&!refreshing){if(pullDistance>=85)loadHeadlines(true);else pull.classList.remove('visible')}pullStart=null;pullDistance=0},{passive:true});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
restoreOffline();loadHeadlines();
</script></body></html>
