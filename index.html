<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#004170"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="-30-"><link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon.png"><link rel="icon" type="image/png" href="assets/app-icon.png"><title>-30- | News Reader</title><style>
@import url('https://fonts.googleapis.com/css2?family=Modak&family=DynaPuff:wght@400;600&family=Rubik:wght@500;600;700&family=Instrument+Serif:ital@0;1&display=swap');
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000}header{background:white;border-bottom:3px solid black;padding:16px 20px 18px}header .brand{font:clamp(55px,12vw,94px)/.95 Modak,serif;letter-spacing:-1px}header .sub{font:12px Arial,sans-serif;margin-top:7px}nav{display:flex;gap:9px;overflow:auto;margin-top:18px;scrollbar-width:none}nav button{flex:none;border:1px solid black;border-radius:30px;padding:8px 14px;background:white;color:black;font:15px DynaPuff,Arial;cursor:pointer}nav button.active{background:black;color:white}main{max-width:780px;margin:auto;padding:25px 20px}.section{font-size:clamp(27px,6vw,43px);font-family:Modak,serif;font-weight:400;line-height:1.2;padding-bottom:20px;border-bottom:2px solid black}.story{padding:22px 0 26px;border-bottom:1px solid #bbb}.story-body{display:flex;gap:17px;align-items:flex-start}.story-copy{flex:1;min-width:0}.stamp{display:block;flex:0 0 86px;width:86px;height:86px;object-fit:cover;border:1px solid #000;background:#fff;filter:grayscale(100%)}.story.featured .stamp{width:108px;height:108px;flex-basis:108px}@media(max-width:420px){.stamp{width:74px;height:74px;flex-basis:74px}.story.featured .stamp{width:88px;height:88px;flex-basis:88px}}.source-mark{display:inline-flex;vertical-align:middle;align-items:center;justify-content:center;min-width:34px;height:30px;padding:2px 4px;border:2px solid #000;border-radius:5px;font:900 11px/1 Arial,sans-serif;letter-spacing:-.5px;margin-right:9px;transform:rotate(-3deg)}.source-mark{border-color:transparent;color:#fff;background:#191919}.source-mark[data-source="The Guardian US"]{background:#1769aa}.source-mark[data-source="The Intercept"]{background:#e85d36}.source-mark[data-source="The Nation"]{background:#6d438d}.source-mark[data-source="Jacobin"]{background:#d52c35}.source-mark[data-source="ProPublica"]{background:#f0c849;color:#111}.source-mark[data-source="In These Times"]{background:#3f8160}.story h2 a{vertical-align:middle}.story .meta{font:11px Arial;letter-spacing:1.2px;text-transform:uppercase}.story h2{font:clamp(25px,5.6vw,38px)/1.18 DynaPuff,Arial;margin:12px 0}.story.featured h2{font-size:clamp(32px,7vw,51px);font-family:Modak,serif;font-weight:400;line-height:1.18}.story a{color:inherit;text-decoration:none}.story a:hover{text-decoration:underline}.story p{font:15px/1.5 Arial,sans-serif;margin:0;color:#333}.archive-link{display:inline-block;margin-top:12px;font:12px Arial,sans-serif;text-decoration:underline!important;text-underline-offset:3px}.empty{font:16px/1.5 Arial;margin-top:25px}.foot{font:12px/1.5 Arial;color:#444;padding:25px 0}button:focus-visible,a:focus-visible{outline:3px solid black;outline-offset:3px}

/* Mobile-first card layout */
body{background:#f5f5f2;-webkit-text-size-adjust:100%}
header{padding:18px 14px 14px;text-align:center;border-bottom:2px solid #111;background:#fff}
header .brand{font-size:clamp(72px,19vw,112px);line-height:.88;letter-spacing:-2px}
header .sub{margin-top:9px;font:11px/1.35 Arial,sans-serif;letter-spacing:.3px}
nav{margin:17px -14px 0;padding:0 14px 3px;gap:8px;scrollbar-width:none;text-align:left;-webkit-overflow-scrolling:touch}
nav button{padding:9px 14px;font-size:13px;min-height:40px;white-space:nowrap}
main{max-width:680px;padding:18px 12px 36px}
.section{font-size:clamp(30px,8vw,43px);border:0;padding:2px 4px 14px;line-height:1}
#stories{display:grid;grid-template-columns:minmax(0,1fr);gap:13px}
.story,.story.featured{padding:0;border:2px solid #111;border-radius:17px;background:#fff;overflow:hidden;box-shadow:3px 4px 0 #111}
.story-body{display:flex;flex-direction:column-reverse;gap:0;align-items:stretch}
.story-copy{padding:15px 16px 17px}
.story .meta{display:flex;align-items:center;gap:8px;font:10px/1.3 Arial,sans-serif;letter-spacing:1px;color:#555}
.story h2,.story.featured h2{font:600 clamp(21px,5.5vw,29px)/1.22 DynaPuff,Arial,sans-serif;margin:11px 0}
.story.featured h2{font-family:Modak,serif;font-weight:400;font-size:clamp(29px,8vw,40px);line-height:1.08}
.story h2 .source-mark{display:none}
.story p{font:13px/1.45 Arial,sans-serif;color:#444;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story .stamp,.story.featured .stamp{display:block;width:100%;height:160px;max-height:none;object-fit:cover;flex:none;border:0;border-bottom:2px solid #111;filter:grayscale(100%)}
.story .story-image{display:block;line-height:0}
.story .source-mark{transform:rotate(-3deg);flex:none;min-width:33px;height:27px;margin:0;border-radius:5px}
.archive-link{font-size:11px;margin-top:11px}
.foot{padding:26px 5px;color:#555}
@media(min-width:640px){header{padding:22px 22px 17px}nav{margin-left:auto;margin-right:auto;max-width:680px;padding:0 4px 4px}main{padding:24px 18px 40px}#stories{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.story .stamp,.story.featured .stamp{height:175px}.story.featured{grid-column:1/-1}.story.featured .stamp{height:250px}}

/* One-column, compact newsstand feed on every screen */
main{max-width:680px}
#stories{display:flex;flex-direction:column;gap:12px}
.story,.story.featured{width:100%;grid-column:auto}
.story-body{display:flex;flex-direction:row;align-items:flex-start;gap:12px;padding:13px}
.story-copy{flex:1;min-width:0;padding:0}
.story .story-image{flex:0 0 76px;width:76px;order:2;align-self:flex-start}
.story .stamp,.story.featured .stamp{width:76px;height:76px;max-height:76px;object-fit:cover;border:1px solid #111;border-radius:4px}
.story h2,.story.featured h2{font:600 clamp(19px,4.7vw,26px)/1.22 DynaPuff,Arial,sans-serif;margin:10px 0 5px}
.story.featured h2{font-family:Modak,serif;font-weight:400;font-size:clamp(26px,6vw,33px)}
.story p{display:none}
.story .meta{flex-wrap:wrap;letter-spacing:.4px}
.archive-link{display:inline-flex;align-items:center;justify-content:center;width:44px;height:35px;margin-top:6px;padding:3px;border:1.5px solid #111;border-radius:9px;background:#fff;text-decoration:none!important}
.archive-link img{width:42px;height:31px;object-fit:cover;display:block}
.archive-link:hover,.archive-link:focus-visible{background:#eee}
@media(min-width:640px){#stories{display:flex;flex-direction:column;gap:14px}.story.featured{grid-column:auto}.story .stamp,.story.featured .stamp{width:90px;height:90px;max-height:90px}.story .story-image{width:90px;flex-basis:90px}.story-body{padding:17px;gap:16px}}
.story .story-image{align-self:center!important}
.story .meta .story-date{font:600 15px/1.2 DynaPuff,Arial,sans-serif;letter-spacing:0;text-transform:none;color:#111}
header .sub{display:none}
.archive-link{border:none!important;box-shadow:none!important;background:transparent!important;padding:0!important;border-radius:0!important}
.archive-link:hover,.archive-link:focus-visible{background:transparent!important}

.section{font-family:Modak,serif}
nav button{font-family:Modak,serif;font-weight:400;font-size:21px;line-height:1;padding:9px 15px}
.story h2,.story.featured h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(26px,5.8vw,35px);line-height:1.08}
.story.featured h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(29px,6.5vw,39px);line-height:1.08}
.headline-lead{font-family:Rubik,Arial,sans-serif;font-weight:700;font-size:.75em;letter-spacing:-.035em;line-height:1.2}
.headline-rest{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
</style></head><body><header><div class="brand">-30-</div><nav id="nav" aria-label="Sections"></nav></header><main><div class="section" id="section">Top Stories</div><div id="stories"><p class="empty">Loading headlines…</p></div><div class="foot">An independent news reader linking to original reporting from multiple publications. Not affiliated with the publishers. Archived versions may not exist for every article.</div></main><script>
const sections=['All','Top Stories','World','U.S.','Politics','New York','Business','Technology','Science','Health','Arts','Books','Movies','Opinion','The Guardian US','The Intercept','The Nation','Jacobin','ProPublica','In These Times'];
let data={sections:{}};let selected='All';const marks={'NYT':'NYT','The Guardian US':'G','The Intercept':'I','The Nation':'N','Jacobin':'J','ProPublica':'P','In These Times':'ITT'};
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const sourceTabs=new Set(['The Guardian US','The Intercept','The Nation','Jacobin','ProPublica','In These Times']);
const topicalTabs=['Top Stories','World','U.S.','Politics','New York','Business','Technology','Science','Health','Arts','Books','Movies','Opinion'];
const rules={
'World':/\b(world|international|foreign|global|europe|asia|africa|middle east|ukraine|russia|israel|gaza|palestine|iran|china|india|britain|france|germany|united nations)\b/i,
'U.S.':/\b(u\.?s\.?|united states|america|american|national|congress|federal|supreme court|immigration|state legislature)\b/i,
'Politics':/\b(politic|election|vote|voting|democrat|republican|trump|biden|white house|congress|senate|president|governor|campaign|policy|government)\b/i,
'New York':/\b(new york|nyc|brooklyn|queens|bronx|manhattan|staten island|albany|mta|subway)\b/i,
'Business':/\b(business|econom|market|finance|stock|wall street|trade|tariff|labor|union|workplace|industry|corporat|inflation|bank|housing)\b/i,
'Technology':/\b(technolog|tech|artificial intelligence|\bai\b|software|internet|digital|social media|cyber|silicon valley|computer|robot)\b/i,
'Science':/\b(science|scientist|research|space|nasa|climate|environment|ecology|biology|physics|astronomy|species)\b/i,
'Health':/\b(health|medicine|medical|hospital|doctor|disease|vaccine|drug|mental health|patient|nutrition)\b/i,
'Arts':/\b(art|artist|museum|gallery|exhibition|culture|theater|theatre|music|dance|architecture|design)\b/i,
'Books':/\b(book|books|literature|novel|author|poetry|publishing|literary|reading)\b/i,
'Movies':/\b(movie|movies|film|cinema|hollywood|director|actor|screenplay)\b/i,
'Opinion':/\b(opinion|editorial|commentary|column|essay|perspective|analysis)\b/i
};
function allArticles(){const seen=new Set();return Object.entries(data.sections).flatMap(([section,arr])=>(arr||[]).map(a=>({...a,_section:section}))).filter(a=>{if(!a.url||seen.has(a.url))return false;seen.add(a.url);return true})}
function interleave(articles,limit=100){const buckets={};for(const a of articles.sort((a,b)=>Date.parse(b.date||0)-Date.parse(a.date||0))){(buckets[a.source||'NYT']??=[]).push(a)}const order=['NYT','The Guardian US','The Intercept','The Nation','Jacobin','ProPublica','In These Times'];const out=[];while(out.length<limit&&order.some(k=>buckets[k]?.length)){for(const k of order)if(buckets[k]?.length&&out.length<limit)out.push(buckets[k].shift())}return out}
function matchesTopic(a,topic){if(topic==='Top Stories')return true;if(a.source==='NYT')return a._section===topic;const terms=[...(a.tags||[]),a.title||''].join(' ');return rules[topic]?.test(terms)||false}
function headlineMarkup(title){const words=String(title||'').trim().split(/\s+/);if(!words.length)return '';let n=Math.min(3,words.length);const first=words[0]?.replace(/^[^\p{L}]+/u,'')||'';const skip=/^(the|a|an|how|why|what|when|where|is|are|will|can|as|in|on|at|for|to|of|after|before)$/i;
if(skip.test(first)&&words.length>3)n=3;
else if(words.length>3){n=2;for(let i=1;i<Math.min(4,words.length);i++){if(/^\p{Lu}/u.test(words[i])&&!/^(The|A|An|And|Of|In|On|For|To|With)$/i.test(words[i]))n=i+1;else break}n=Math.min(n,3)}
return '<span class="headline-lead">'+safe(words.slice(0,n).join(' '))+'</span>'+(words.length>n?' <span class="headline-rest">'+safe(words.slice(n).join(' '))+'</span>':'')}
function render(){document.querySelector('#section').textContent=selected;document.querySelector('#nav').innerHTML=sections.map(s=>'<button data-section="'+safe(s)+'" class="'+(s===selected?'active':'')+'">'+safe(s)+'</button>').join('');let items;const all=allArticles();if(selected==='All')items=interleave(all);else if(sourceTabs.has(selected))items=interleave(all.filter(a=>a.source===selected));else items=interleave(all.filter(a=>matchesTopic(a,selected)));document.querySelector('#stories').innerHTML=items.length?items.map((a,i)=>{let url=a.url;let source=a.source||'NYT';let mark=marks[source]||'•';let archive='https://archive.is/'+a.url;return '<article class="story '+(i===0?'featured':'')+'"><div class="story-body"><div class="story-copy"><div class="meta"><span class="source-mark" data-source="'+safe(source)+'" title="'+safe(source)+'">'+safe(mark)+'</span><span class="story-date">'+(a.date?safe(new Date(a.date).toLocaleDateString('en-US',{month:'numeric',day:'numeric'})):'')+'</span></div><h2><a href="'+safe(url)+'" target="_blank" rel="noopener noreferrer">'+headlineMarkup(a.title)+'</a></h2>'+(a.summary?'<p>'+safe(a.summary)+'</p>':'')+(source==='NYT'?'<a class="archive-link" aria-label="Look for archived copy on archive.is" title="Look for archived copy on archive.is" href="'+safe(archive)+'" target="_blank" rel="noopener noreferrer"><img src="assets/archive-eyes.svg" alt="" loading="lazy"></a>':'')+'</div>'+(a.image?'<a class="story-image" href="'+safe(url)+'" target="_blank" rel="noopener noreferrer" aria-label="Read '+safe(a.title)+'"><img class="stamp" src="'+safe(a.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer"></a>':'')+'</div></article>'}).join(''):'<p class="empty">No headlines available for this section yet.</p>';document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{selected=b.dataset.section;render()})}
fetch('headlines.json?x='+Math.floor(Date.now()/900000)).then(r=>{if(!r.ok)throw Error('Feed unavailable');return r.json()}).then(d=>{data=d;render()}).catch(()=>{document.querySelector('#stories').innerHTML='<p class="empty">Headlines are not available yet. The scheduled update will populate this page shortly.</p>';render()});
</script></body></html>
