name: Refresh headlines and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'headlines.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch RSS headlines
        run: python3 scripts/fetch.py
      - name: Collect homepage and public discussion signals
        run: python3 scripts/signals.py
      - name: Extract public articles for offline reading
        run: python3 scripts/extract.py
      - name: Prepare Pages files
        run: |
          mkdir -p public
          cp index.html headlines.json articles.json signals.json sw.js public/
          cp -R assets public/
          touch public/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Commit updated headline data (best effort)
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp headlines.json /tmp/gazer-headlines.json
          cp articles.json /tmp/gazer-articles.json
          cp signals.json /tmp/gazer-signals.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/gazer-headlines.json headlines.json
          cp /tmp/gazer-articles.json articles.json
          cp /tmp/gazer-signals.json signals.json
          git add headlines.json articles.json signals.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh headlines"
            git push origin HEAD:main
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
